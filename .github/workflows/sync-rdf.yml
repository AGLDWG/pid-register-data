name: Synchronise RDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdf-sparql-sync-main
  cancel-in-progress: false

jobs:
  sync-rdf:
    name: Synchronise RDF to SPARQL
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A queued run must not synchronise an older snapshot after a newer merge.
          ref: main
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked --no-dev

      - name: Synchronise manifest resources
        env:
          SPARQL_ENDPOINT: ${{ secrets.SPARQL_ENDPOINT }}
          SPARQL_USERNAME: ${{ secrets.SPARQL_USERNAME }}
          SPARQL_PASSWORD: ${{ secrets.SPARQL_PASSWORD }}
        run: bash scripts/sync.sh
